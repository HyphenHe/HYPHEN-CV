<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Hyphen's Homepage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Left Side - Image */
    .image-side {
      flex: 1;
      /* 修改点1：使用 %20 替代空格，提高兼容性；添加后备背景色便于调试 */
      background: url('Selfie%20(2).png') center/cover no-repeat, #f0f0f0;
      position: relative;
      animation: fadeInLeft 1.2s ease-out;
    }

    /* Right Side - Frosted Purple */
    .content-side {
      flex: 1;
      background: linear-gradient(135deg, #5B2E91 0%, #7B4FA8 50%, #4A2375 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
      animation: fadeInRight 1.2s ease-out;
    }

    /* Decorative circles */
    .content-side::before,
    .content-side::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
    }

    .content-side::before {
      width: 400px;
      height: 400px;
      top: -100px;
      right: -100px;
    }

    .content-side::after {
      width: 300px;
      height: 300px;
      bottom: -50px;
      left: -50px;
    }

    .welcome-text {
      color: #ffffff;
      font-size: 48px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 50px;
      z-index: 1;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.8s ease-out 0.3s both;
      letter-spacing: -0.5px;
      line-height: 1.3;
    }

    .continue-btn {
      background: rgba(255, 255, 255, 0.95);
      color: #5B2E91;
      padding: 20px 60px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 1;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.8s ease-out 0.5s both;
      text-decoration: none;
      display: inline-block;
    }

    .continue-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
      background: #ffffff;
    }

    .continue-btn:active {
      transform: translateY(-1px);
    }

    /* Animations */
    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeInRight {
      from {
        opacity: 0;
        transform: translateX(50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive Design */
    @media (max-width: 968px) {
      .container {
        flex-direction: column;
      }

      .image-side {
        flex: 0.6;
        min-height: 300px;
      }

      .content-side {
        flex: 1;
        padding: 40px 30px;
      }

      .welcome-text {
        font-size: 32px;
        margin-bottom: 40px;
      }

      .continue-btn {
        padding: 18px 50px;
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      .welcome-text {
        font-size: 28px;
      }

      .continue-btn {
        padding: 16px 40px;
        font-size: 16px;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="image-side"></div>
    <div class="content-side">
      <h1 class="welcome-text">Welcome to Hyphen's Homepage</h1>
      <a href="https://hyphenhe.github.io/HYPHEN-CV/" class="continue-btn">Continue</a>
    </div>
  </div>

  <script>
    // Add parallax effect on mouse move
    document.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX / window.innerWidth;
      const mouseY = e.clientY / window.innerHeight;
      
      const imageSide = document.querySelector('.image-side');
      imageSide.style.transform = `translate(${mouseX * 10}px, ${mouseY * 10}px) scale(1.05)`;
    });
  </script>
</body>
</html>
